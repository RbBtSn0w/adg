name: Scheduled Release PR

# Every Friday at 15:00 CST (07:00 UTC), check if develop has unreleased commits
# ahead of main. If so, open a `develop -> main` release PR and enable auto-merge.
# Once CI completes and all checks pass without failure or conflicts, GitHub
# automatically merges the PR into main, triggering the stable production release.
on:
  schedule:
    # 15:00 every Friday Beijing time (UTC+8) -> 07:00 UTC Friday
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-release-pr
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open and Auto-Merge Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-bot token
        id: bot
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create or Update Promotion PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_CUSTOM_TOKEN: ${{ steps.bot.outputs.token != '' || secrets.SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail

          if [ "${HAS_CUSTOM_TOKEN}" != "true" ]; then
            echo "::warning::Neither release-bot App nor SYNC_TOKEN was available; falling back to default GITHUB_TOKEN. Note that pull requests opened with GITHUB_TOKEN do not automatically trigger CI workflow runs under GitHub's default security policy."
          fi

          git fetch --quiet origin main develop

          ahead="$(git rev-list --count origin/main..origin/develop)"
          if [ "$ahead" -eq 0 ]; then
            echo "develop has no new commits ahead of main; nothing to release."
            exit 0
          fi

          echo "develop is ${ahead} commit(s) ahead of main."

          # Look for existing open PR from develop to main
          pr="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "$pr" ]; then
            echo "Creating release promotion PR (develop -> main)..."
            gh pr create --base main --head develop \
              --title "chore(release): promote develop to stable" \
              --body $'### 📦 Scheduled Stable Release\n\nAutomated weekly release promotion from `develop` to `main`.\n\n- Auto-merge is enabled with `--merge` commit strategy.\n- Once CI passes and checks are green, GitHub will automatically merge this PR.\n- Merging into `main` triggers semantic-release to publish the stable package to npm and GitHub Releases, followed by automated back-merge to `develop`.'
            pr="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          fi

          echo "Release PR #${pr} ready."

          # Enable native GitHub auto-merge (idempotent if already enabled on existing PR)
          echo "Enabling auto-merge on PR #${pr}..."
          if ! gh pr merge "$pr" --merge --auto --delete-branch=false 2>&1 | tee /tmp/merge.log; then
            if grep -Eqi "already|pull request is already" /tmp/merge.log; then
              echo "Auto-merge already active on PR #${pr}."
            else
              echo "Failed to enable auto-merge on PR #${pr}." >&2
              exit 1
            fi
          fi
          echo "Auto-merge configured for PR #${pr}."
