name: Publish PR preview to npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  publish:
    name: Publish verified preview on next
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      number: ${{ steps.source.outputs.number }}
      head: ${{ steps.source.outputs.head }}
      artifact: ${{ steps.source.outputs.artifact }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Resolve the verified artifact for the current PR head
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + '/' + repo;
            const source = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: source.id });
            if (run.path !== '.github/workflows/ci.yml' || run.event !== 'pull_request' ||
                run.conclusion !== 'success' || run.run_attempt !== source.run_attempt ||
                run.head_repository?.full_name?.toLowerCase() !== repository.toLowerCase() ||
                !/^[0-9a-f]{40}$/.test(run.head_sha) || run.pull_requests.length !== 1) {
              throw new Error('The successful CI run has no unique eligible pull request.');
            }
            const [{ number, head }] = run.pull_requests;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== run.head_sha ||
                head.sha !== run.head_sha || pr.head.repo?.id !== run.head_repository.id ||
                pr.base.repo.id !== run.head_repository.id) {
              core.notice('The source is no longer the current head of an open same-repository PR to main.');
              return;
            }
            const name = `adg-pr-${number}-${run.head_sha}-attempt-${run.run_attempt}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id, name,
            });
            const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
            if (matches.length !== 1) throw new Error('The verified PR preview artifact is unavailable.');
            core.setOutput('number', number);
            core.setOutput('head', run.head_sha);
            core.setOutput('artifact', matches[0].id);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.source.outputs.artifact != ''
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 12
        if: steps.source.outputs.artifact != ''
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.source.outputs.artifact != ''
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/npm-preview
      - name: Publish the exact archive and verify registry integrity
        id: publish
        if: steps.source.outputs.artifact != ''
        env:
          PR_NUMBER: ${{ steps.source.outputs.number }}
          PR_HEAD: ${{ steps.source.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/npm-preview
        run: |
          test "$(cat commit.txt)" = "$PR_HEAD"
          version="$(cat version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.pr${PR_NUMBER}\.g${PR_HEAD:0:12}$ ]]
          test "$(shasum -a 256 adg-pr-preview.tgz)" = "$(cat SHA256SUMS)"
          tar -xOzf adg-pr-preview.tgz package/package.json | node -e '
            const { name, version, publishConfig } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (name !== "@rbbtsn0w/adg" || version !== process.argv[1] ||
                JSON.stringify(publishConfig) !== JSON.stringify({ access: "public" })) {
              throw new Error("Unexpected npm preview package identity or publish configuration");
            }
          ' "$version"

          expected="sha512-$(openssl dgst -sha512 -binary adg-pr-preview.tgz | openssl base64 -A)"
          lookup() {
            node --input-type=module -e '
              const response = await fetch("https://registry.npmjs.org/@rbbtsn0w%2fadg/" + process.argv[1]);
              if (response.status === 404) process.exit(0);
              if (!response.ok) throw new Error("Registry lookup returned " + response.status);
              const { dist } = await response.json();
              if (!dist?.integrity) throw new Error("Missing npm registry integrity");
              console.log(dist.integrity);
            ' "$version"
          }
          integrity="$(lookup)"
          if [ -z "$integrity" ]; then
            current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')"
            if [ "$current" != "$PR_HEAD" ]; then
              echo "::notice::The PR head changed before publication."
              exit 0
            fi
            publish_status=0
            npm publish ./adg-pr-preview.tgz --ignore-scripts --access public --tag next --registry https://registry.npmjs.org || publish_status=$?
            for attempt in 1 2 3 4 5; do
              integrity="$(lookup)"
              [ -z "$integrity" ] || break
              sleep "$((attempt * 2))"
            done
            if [ -z "$integrity" ] && [ "$publish_status" -ne 0 ]; then
              exit "$publish_status"
            fi
          fi
          test "$integrity" = "$expected"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  announce:
    name: Restore npm commands in PR Conversation
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.publish.outputs.number }}
          PR_HEAD: ${{ needs.publish.outputs.head }}
          ARTIFACT_ID: ${{ needs.publish.outputs.artifact }}
          VERSION: ${{ needs.publish.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { PR_NUMBER, PR_HEAD, ARTIFACT_ID, VERSION } = process.env;
            const issue_number = Number(PR_NUMBER);
            const marker = '<!-- adg-pr-dev-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.head.sha !== PR_HEAD) return;

            const spec = '@rbbtsn0w/adg@' + VERSION;
            const root = 'https://github.com/' + owner + '/' + repo;
            const artifact = root + '/actions/runs/' + context.payload.workflow_run.id + '/artifacts/' + ARTIFACT_ID;
            const body = [
              marker, '### PR dev preview', '',
              '| Registry | Package / Version | Dev channel |', '| --- | --- | --- |',
              '| npm | `' + spec + '` | `next` |', '',
              'PR head commit [`' + PR_HEAD.slice(0, 12) + '`](' + root + '/commit/' + PR_HEAD + ')', '',
              '#### Run without installing', '', '```bash', 'npx ' + spec + ' --version', '```', '',
              '#### Update with ADG', '', '```bash', 'adg update --tag ' + VERSION, '```', '',
              'Use `adg update --dev` to follow the moving `next` channel.', '',
              '#### Install globally', '', '```bash', 'npm install -g ' + spec, '```', '',
              '[Download the verified build archive](' + artifact + ') (available for 14 days).',
            ].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
