name: Publish PR dev preview

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful CI run ID for the current PR head
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish verified preview on next
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      packages: write
      id-token: write
    outputs:
      number: ${{ steps.source.outputs.number }}
      head: ${{ steps.source.outputs.head }}
      artifact: ${{ steps.source.outputs.artifact }}
      attempt: ${{ steps.source.outputs.attempt }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      npm-next: ${{ steps.npm.outputs.next }}
      mirror-next: ${{ steps.mirror.outputs.next }}
      version: ${{ steps.verify.outputs.version }}
      npm: ${{ steps.npm.outputs.available }}
      github-packages: ${{ steps.mirror.outputs.available }}
    steps:
      - name: Resolve the verified artifact for the current PR head
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + '/' + repo;
            const run_id = Number(process.env.SOURCE_RUN_ID);
            if (!/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID) || !Number.isSafeInteger(run_id)) {
              throw new Error('Enter a positive CI run ID.');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.path !== '.github/workflows/ci.yml' || run.event !== 'pull_request' ||
                run.conclusion !== 'success' ||
                run.repository?.full_name?.toLowerCase() !== repository.toLowerCase() ||
                run.head_repository?.full_name?.toLowerCase() !== repository.toLowerCase() ||
                !/^[0-9a-f]{40}$/.test(run.head_sha) || run.pull_requests.length !== 1) {
              throw new Error('The successful CI run has no unique eligible pull request.');
            }
            const [{ number, head }] = run.pull_requests;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== run.head_sha ||
                head.sha !== run.head_sha || pr.head.repo?.id !== run.head_repository.id ||
                pr.base.repo.id !== run.head_repository.id) {
              core.notice('The source is no longer the current head of an open same-repository PR to main.');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'all',
            });
            const previewJobs = jobs.filter(job =>
              job.name === 'PR dev preview' && job.run_id === run.id && job.conclusion === 'success' &&
              Number.isSafeInteger(job.run_attempt) && job.run_attempt > 0 && job.run_attempt <= run.run_attempt &&
              job.steps?.some(step => step.name === 'Upload verified preview' && step.conclusion === 'success'));
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: run.id,
            });
            const attempts = [...new Set(previewJobs.map(job => job.run_attempt))].sort((a, b) => b - a);
            // A downstream-only rerun can copy a successful packaging record without uploading anything.
            for (const attempt of attempts) {
              const name = `adg-pr-${number}-${run.head_sha}-attempt-${attempt}`;
              const matches = artifacts.filter(artifact => artifact.name === name && artifact.expired === false);
              if (matches.length === 0) continue;
              if (matches.length !== 1 || !Number.isSafeInteger(matches[0].id) || matches[0].id <= 0 ||
                  previewJobs.filter(job => job.run_attempt === attempt).length !== 1) {
                throw new Error('The verified PR preview artifact is ambiguous.');
              }
              core.setOutput('number', number);
              core.setOutput('head', run.head_sha);
              core.setOutput('artifact', matches[0].id);
              core.setOutput('attempt', attempt);
              return;
            }
            throw new Error('The verified PR preview artifact is unavailable.');
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.artifact != ''
        with:
          ref: ${{ github.workflow_sha }}
          path: preview-tools
          sparse-checkout: |
            .github/pr-preview
            .github/release-train
            src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.source.outputs.artifact != ''
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm 12
        if: steps.source.outputs.artifact != ''
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install preview tooling dependencies
        if: steps.source.outputs.artifact != ''
        working-directory: preview-tools
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.source.outputs.artifact != ''
        with:
          artifact-ids: ${{ steps.source.outputs.artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/npm-preview
          merge-multiple: true
      - name: Verify the exact preview archive
        id: verify
        if: steps.source.outputs.artifact != ''
        env:
          PR_NUMBER: ${{ steps.source.outputs.number }}
          PR_HEAD: ${{ steps.source.outputs.head }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        working-directory: ${{ runner.temp }}/npm-preview
        run: |
          test "$(cat commit.txt)" = "$PR_HEAD"
          version="$(cat version.txt)"
          short_sha="${PR_HEAD:0:7}"
          if [[ "$short_sha" =~ ^0[0-9]{6}$ ]]; then short_sha="g$short_sha"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.pr${PR_NUMBER}\.${short_sha}$ ]]
          test "$(shasum -a 256 adg-pr-preview.tgz)" = "$(cat SHA256SUMS)"
          sha256="$(cut -d ' ' -f 1 SHA256SUMS)"
          # Pre-receipt archives still carry the verified commit, version, and checksum files.
          if [ -e receipt.json ]; then
            node -e '
              const [pr, head, runId, attempt, version, sha256] = process.argv.slice(1);
              const receipt = JSON.parse(require("node:fs").readFileSync("receipt.json", "utf8"));
              const expected = { pr, head, runId, attempt, name: "@rbbtsn0w/adg", version, sha256 };
              if (Object.entries(expected).some(([key, value]) => receipt?.[key] !== value)) {
                throw new Error("Preview receipt does not match the selected archive");
              }
            ' "$PR_NUMBER" "$PR_HEAD" "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT" "$version" "$sha256"
          fi
          tar -xOzf adg-pr-preview.tgz package/package.json | node -e '
            const { name, version, publishConfig } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (name !== "@rbbtsn0w/adg" || version !== process.argv[1] ||
                JSON.stringify(publishConfig) !== JSON.stringify({ access: "public" })) {
              throw new Error("Unexpected npm preview package identity or publish configuration");
            }
          ' "$version"
          node "$GITHUB_WORKSPACE/preview-tools/.github/pr-preview/version.mjs" \
            guard "$version" stable-baseline.txt

          expected="sha512-$(openssl dgst -sha512 -binary adg-pr-preview.tgz | openssl base64 -A)"
          printf 'version=%s\nintegrity=%s\nsha256=%s\n' "$version" "$expected" "$sha256" >> "$GITHUB_OUTPUT"

          cat > "$RUNNER_TEMP/publish-preview.sh" <<'BASH'
          registry="$1"
          archive="$PWD/adg-pr-preview.tgz"
          baseline="$PWD/stable-baseline.txt"
          tools="$GITHUB_WORKSPACE/preview-tools/.github/pr-preview"
          npm_directory="$(mktemp -d "$RUNNER_TEMP/preview-registry.XXXXXX")"
          cd "$npm_directory"
          export npm_config_cache="$npm_directory/cache"
          if [ "$registry" = 'https://npm.pkg.github.com' ]; then
            export NPM_CONFIG_USERCONFIG="$npm_directory/npmrc"
            # shellcheck disable=SC2016
            printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi

          present="$(node "$tools/registry.mjs" probe "$registry")"
          if [ "$present" = 'true' ]; then
            node "$tools/registry.mjs" verify-existing "$registry"
            exit 0
          fi

          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')"
          if [ "$current" != "$PR_HEAD" ]; then
            echo "::notice::The PR head changed before publication."
            exit 0
          fi
          node "$tools/version.mjs" guard "$PREVIEW_VERSION" "$baseline"
          if npm publish "$archive" --ignore-scripts --access public --tag next --registry "$registry"; then
            printf 'accepted=true\n' >> "$GITHUB_OUTPUT"
            echo 'The registry accepted the upload. Checking package and tag availability.'
          else
            printf 'accepted=unknown\n' >> "$GITHUB_OUTPUT"
            echo '::warning::The upload result is uncertain. Checking registry availability.'
          fi
          node "$tools/registry.mjs" verify-published "$registry"
          BASH
      - name: Publish to npm next
        id: npm
        if: steps.verify.outputs.version != ''
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.source.outputs.number }}
          PR_HEAD: ${{ steps.source.outputs.head }}
          PREVIEW_VERSION: ${{ steps.verify.outputs.version }}
          PREVIEW_INTEGRITY: ${{ steps.verify.outputs.integrity }}
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/npm-preview
        run: bash -eu -o pipefail "$RUNNER_TEMP/publish-preview.sh" https://registry.npmjs.org
      - name: Mirror to GitHub Packages next
        id: mirror
        if: steps.verify.outputs.version != ''
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.source.outputs.number }}
          PR_HEAD: ${{ steps.source.outputs.head }}
          PREVIEW_VERSION: ${{ steps.verify.outputs.version }}
          PREVIEW_INTEGRITY: ${{ steps.verify.outputs.integrity }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/npm-preview
        run: bash -eu -o pipefail "$RUNNER_TEMP/publish-preview.sh" https://npm.pkg.github.com
      - name: Summarize registry verification
        if: always() && steps.verify.outputs.version != ''
        env:
          NPM_ACCEPTED: ${{ steps.npm.outputs.accepted }}
          NPM_OBSERVATION: ${{ steps.npm.outputs.observation }}
          NPM_AVAILABLE: ${{ steps.npm.outputs.available }}
          NPM_NEXT: ${{ steps.npm.outputs.next }}
          MIRROR_ACCEPTED: ${{ steps.mirror.outputs.accepted }}
          MIRROR_OBSERVATION: ${{ steps.mirror.outputs.observation }}
          MIRROR_AVAILABLE: ${{ steps.mirror.outputs.available }}
          MIRROR_NEXT: ${{ steps.mirror.outputs.next }}
        run: |
          {
            printf '### Registry verification\n\n'
            printf '| Registry | Upload accepted | Exact version verified | Next verified | Observation |\n'
            printf '| --- | --- | --- | --- | --- |\n'
            printf '| npmjs | %s | %s | %s | %s |\n' "${NPM_ACCEPTED:-no request}" "${NPM_AVAILABLE:-unconfirmed}" "${NPM_NEXT:-unconfirmed}" "${NPM_OBSERVATION:-unconfirmed}"
            printf '| GitHub Packages | %s | %s | %s | %s |\n' "${MIRROR_ACCEPTED:-no request}" "${MIRROR_AVAILABLE:-unconfirmed}" "${MIRROR_NEXT:-unconfirmed}" "${MIRROR_OBSERVATION:-unconfirmed}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require an available registry preview
        if: >-
          steps.npm.outputs.available != 'true' && steps.mirror.outputs.available != 'true' &&
          (steps.npm.outcome == 'failure' || steps.mirror.outcome == 'failure')
        run: |
          echo "::error::Neither registry confirmed the PR preview archive."
          exit 1

  announce:
    name: Announce released PR preview
    needs: publish
    if: needs.publish.outputs.npm == 'true' || needs.publish.outputs.github-packages == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: adg-preview-card-${{ needs.publish.outputs.number }}
      queue: max
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.publish.outputs.number }}
          PR_HEAD: ${{ needs.publish.outputs.head }}
          ARTIFACT_ID: ${{ needs.publish.outputs.artifact }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ needs.publish.outputs.version }}
          ATTEMPT: ${{ needs.publish.outputs.attempt }}
          SHA256: ${{ needs.publish.outputs.sha256 }}
          NPM_NEXT: ${{ needs.publish.outputs.npm-next }}
          MIRROR_NEXT: ${{ needs.publish.outputs.mirror-next }}
          NPM_AVAILABLE: ${{ needs.publish.outputs.npm }}
          MIRROR_AVAILABLE: ${{ needs.publish.outputs.github-packages }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { PR_NUMBER, PR_HEAD, ARTIFACT_ID, SOURCE_RUN_ID, VERSION, NPM_AVAILABLE, MIRROR_AVAILABLE } = process.env;
            const { ATTEMPT, SHA256, NPM_NEXT, MIRROR_NEXT } = process.env;
            const issue_number = Number(PR_NUMBER);
            const marker = '<!-- adg-pr-dev-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== PR_HEAD ||
                pr.head.repo?.full_name?.toLowerCase() !== (owner + '/' + repo).toLowerCase()) return;

            const spec = '@rbbtsn0w/adg@' + VERSION;
            const root = 'https://github.com/' + owner + '/' + repo;
            const artifact = root + '/actions/runs/' + SOURCE_RUN_ID + '/artifacts/' + ARTIFACT_ID;
            const npmAvailable = NPM_AVAILABLE === 'true';
            const rows = [];
            if (npmAvailable) rows.push('| **npm** | `' + spec + '` | ' + (NPM_NEXT === 'true' ? 'Observed pointing here' : 'Unconfirmed') + ' |');
            if (MIRROR_AVAILABLE === 'true') rows.push('| **GitHub Packages** | `' + spec + '` | ' + (MIRROR_NEXT === 'true' ? 'Observed pointing here' : 'Unconfirmed') + ' |');
            if (rows.length === 0) return;

            const scopedConfig = 'NPM_CONFIG_USERCONFIG="$preview_config" ';
            const tryCommand = npmAvailable
              ? 'npx ' + spec + ' --version'
              : scopedConfig + 'npm exec --package=' + spec + ' -- adg --version';
            const switchCommand = npmAvailable
              ? 'adg update --tag ' + VERSION
              : scopedConfig + 'npm install -g ' + spec;
            const lines = [
              marker, '<!-- verified-registry-preview:' + PR_HEAD + ' -->', '### 🚀 PR Dev Preview Released', '',
              '#### Try this PR', '',
            ];
            if (!npmAvailable) {
              lines.push(
                'Set `GH_PACKAGES_TOKEN` to a token with `read:packages`. This temporary config routes the `@rbbtsn0w` scope to GitHub Packages and leaves npmjs as the default registry.', '',
                '```bash', 'preview_config="$(mktemp)"',
                "printf '%s\\n' 'registry=https://registry.npmjs.org' '@rbbtsn0w:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}' > \"$preview_config\"",
                '```', '',
              );
            }
            lines.push(
              '```bash', tryCommand, '```', '',
              '#### Switch your global ADG to this PR', '',
              '```bash', switchCommand, '```', '',
            );
            if (npmAvailable) {
              lines.push(
                '<details>', '<summary>Install this version directly with npm</summary>', '',
                '```bash', 'npm install -g ' + spec, '```', '', '</details>', '',
              );
            }
            lines.push(
              '#### Follow the repository preview channel', '',
              '`adg update --dev` follows the shared `next` tag on your configured registry. A preview published from any PR can move that tag.', '',
              '| Registry | Package / Version | next at read-back |', '| --- | --- | --- |',
              ...rows, '',
              'PR head commit [`' + PR_HEAD + '`](' + root + '/commit/' + PR_HEAD + ')', '',
              '[Download the verified build archive](' + artifact + ') (available for 14 days).', '',
              'Run `' + SOURCE_RUN_ID + '` · packaging attempt `' + ATTEMPT + '` · artifact `' + ARTIFACT_ID + '`', '',
              'After extracting the ZIP, run `shasum -a 256 -c SHA256SUMS` before installing the archive.', '',
              'SHA-256 `' + SHA256 + '`',
            );
            const body = lines.join('\n');
            if (existing?.body === body) return;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
