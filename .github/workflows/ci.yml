name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise each supported Node line, including the exact 22.x and 24.x
          # minimums. Ubuntu, macOS, and Windows remain compatibility targets.
          - os: ubuntu-latest
            node-version: 22.22.2
          - os: ubuntu-latest
            node-version: 24.15.0
            package-smoke: true
          - os: ubuntu-latest
            node-version: 26
          - os: macos-latest
            node-version: 24
          - os: macos-latest
            node-version: 26
          - os: windows-latest
            node-version: 24
          - os: windows-latest
            node-version: 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Use npm 12
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/release-npm" --ignore-scripts --no-audit --no-fund npm@12.2.2
          echo "$RUNNER_TEMP/release-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Show selected Node and npm
        run: |
          node --version
          npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run check:vendor-deps
      - run: npm run check:docs
      - run: npm run check:test-isolation
      # Keep the shipped CLI's runtime dependencies clean. Dev-only tooling is
      # monitored by Dependabot and constrained with overrides when fixes exist.
      # Gate audit to the single canonical smoke runner with retry to prevent redundant
      # API churn and external 503 registry failures from blocking the entire matrix.
      - name: Audit production dependencies
        if: matrix.package-smoke == true
        run: |
          for i in 1 2 3; do
            if npm run audit:prod; then
              exit 0
            fi
            echo "npm audit failed (attempt $i/3); retrying in 5s..."
            sleep 5
          done
          npm run audit:prod
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Verify packed CLI
        if: matrix.package-smoke == true
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed"
          npm run test:package -- "$RUNNER_TEMP"/packed/*.tgz
      - run: npm run check:vendor-upstream
        if: matrix.package-smoke == true
