name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the declared minimum plus the current three Node.js release
          # lines. Windows remains a first-class compatibility target.
          - os: ubuntu-latest
            node-version: 22.18.0
          - os: ubuntu-latest
            node-version: 24
            package-smoke: true
          - os: ubuntu-latest
            node-version: 25
          - os: ubuntu-latest
            node-version: 26
          - os: windows-latest
            node-version: 24
          - os: windows-latest
            node-version: 25
          - os: windows-latest
            node-version: 26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run check:vendor-deps
      - run: npm run check:docs
      # Keep the shipped CLI's runtime dependencies clean. Dev-only tooling is
      # monitored by Dependabot and constrained with overrides when fixes exist.
      # Gate audit to the single canonical smoke runner with retry to prevent redundant
      # API churn and external 503 registry failures from blocking the entire matrix.
      - name: Audit production dependencies
        if: matrix.package-smoke == true
        run: |
          for i in 1 2 3; do
            if npm run audit:prod; then
              exit 0
            fi
            echo "npm audit failed (attempt $i/3); retrying in 5s..."
            sleep 5
          done
          npm run audit:prod
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:package-smoke
        if: matrix.package-smoke == true
      - run: npm run check:vendor-upstream
        if: matrix.package-smoke == true

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write # 某些 npm 发布验证需要
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
      - name: Upgrade npm for trusted publishing
        # npm's OIDC trusted-publishing flow requires npm >= 11.5.1. Node LTS
        # still bundles npm 10.x, which silently skips OIDC and then fails for
        # lack of an NPM_TOKEN. Pin a known-good npm so publish uses OIDC.
        run: npm install -g npm@11.18.0
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        # Must run before publish: npm validates the `bin` target exists when it
        # normalizes package.json at the START of `npm publish` — earlier than
        # the `prepack` hook — so on a fresh checkout `dist/bin/adg.js` has to be
        # present already, or npm strips the `bin` entry from the published package.
        run: npm run build
      - name: Record version before release
        id: preversion
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release@25
      - name: Dual Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-github-packages.sh
      # Optional, best-effort: append GitHub's "New Contributors" section to the
      # release notes. Only runs when semantic-release actually cut a release
      # (package.json version changed). Never fails the release.
      - name: Append new contributors to release notes
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new="$(node -p 'require("./package.json").version')"
          prev="${{ steps.preversion.outputs.version }}"
          if [ "$new" = "$prev" ]; then
            echo "No new release this run (version unchanged: $new); skipping."
            exit 0
          fi
          # tagFormat in .releaserc.json is the bare version (no "v" prefix).
          notes="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$new" -f previous_tag_name="$prev" --jq .body 2>/dev/null || true)"
          section="$(printf '%s\n' "$notes" \
            | awk '/^## New Contributors/{p=1} p && /^\*\*Full Changelog\*\*/{exit} p')"
          if [ -z "$section" ]; then
            echo "No new contributors for ${new}; nothing to append."
            exit 0
          fi
          body="$(gh release view "$new" --json body --jq .body 2>/dev/null || true)"
          # Idempotent: a re-run for the same tag must not append a second
          # section. Skip if the release body already has one.
          case "$body" in
            *"## New Contributors"*)
              echo "New Contributors section already present on ${new}; skipping."
              exit 0
              ;;
          esac
          printf '%s\n\n%s\n' "$body" "$section" | gh release edit "$new" --notes-file -
          echo "Appended New Contributors section to release ${new}."
      # Homebrew tap publish only runs for stable releases on main, and only when
      # the release-bot GitHub App is configured. This keeps beta integration
      # pushes green and prevents an unconfigured optional mirror from failing
      # the (already successful) npm / GitHub release.
      - name: Create release bot token
        if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: release-bot
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: RbBtSn0w
          repositories: homebrew-tap
      - name: Checkout homebrew tap
        if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_BOT_APP_ID != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: RbBtSn0w/homebrew-tap
          token: ${{ steps.release-bot.outputs.token }}
          ref: main
          path: homebrew-tap
      - name: Update homebrew formula
        if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_BOT_APP_ID != '' }}
        env:
          HOMEBREW_TAP_DIR: ${{ github.workspace }}/homebrew-tap
        run: ./scripts/publish-homebrew-tap.sh
      - name: Commit homebrew formula update
        if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_BOT_APP_ID != '' }}
        working-directory: homebrew-tap
        run: |
          version="$(node -p 'require("../package.json").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then check the index — git diff (no --cached) does not
          # see a brand-new untracked Formula/adg.rb, so the first publish must
          # not be gated on it.
          git add Formula/adg.rb
          if git diff --cached --quiet -- Formula/adg.rb; then
            echo "No Homebrew formula changes to commit."
            exit 0
          fi
          git commit -m "chore: update adg to ${version}"
          git push origin HEAD:main

  pr-dev-release:
    name: PR Dev Preview Release
    needs: test
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Calculate Dev Version
        id: versioning
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          BASE_VERSION="$(node -p 'require("./package.json").version.replace(/-.*$/, "")')"
          DEV_VERSION="${BASE_VERSION}-dev.pr${PR_NUM}.${SHORT_SHA}"
          npm version "${DEV_VERSION}" --no-git-tag-version --allow-same-version
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (next dist-tag)
        id: npm_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          DEV_VERSION="${{ steps.versioning.outputs.dev_version }}"
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "Publishing ${DEV_VERSION} to npm with NPM_TOKEN..."
            if npm publish --tag next --access public; then
              echo "npm_published=true" >> "$GITHUB_OUTPUT"
              echo "Successfully published ${DEV_VERSION} to npm (dist-tag: next)"
            else
              echo "npm_published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::npm publish with NPM_TOKEN failed."
            fi
          else
            echo "NPM_TOKEN secret is not set; attempting OIDC provenance publish..."
            sed -i.bak '/_authToken/d' ~/.npmrc || true
            if npm publish --provenance --tag next --access public; then
              echo "npm_published=true" >> "$GITHUB_OUTPUT"
              echo "Successfully published ${DEV_VERSION} to npm via OIDC (dist-tag: next)"
            else
              echo "npm_published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::npm publish via OIDC rejected. (npm OIDC Trusted Publisher policy may require main/beta). Ensure NPM_TOKEN secret is configured for PR releases."
            fi
          fi

      - name: Mirror to GitHub Packages
        id: gh_packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV_VERSION="${{ steps.versioning.outputs.dev_version }}"
          publish_log="$(mktemp)"
          cleanup() { rm -f .npmrc "$publish_log"; }
          trap cleanup EXIT
          {
            echo "@rbbtsn0w:registry=https://npm.pkg.github.com"
            echo '//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}'
          } > .npmrc
          if npm publish --registry https://npm.pkg.github.com --tag next 2> "$publish_log"; then
            cat "$publish_log" >&2
            echo "gh_packages_published=true" >> "$GITHUB_OUTPUT"
            echo "Successfully mirrored ${DEV_VERSION} to GitHub Packages"
          else
            cat "$publish_log" >&2
            if grep -Eqi 'EPUBLISHCONFLICT|cannot publish over|version .+ already exists' "$publish_log"; then
              echo "gh_packages_published=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Packages: version ${DEV_VERSION} already exists."
            else
              echo "gh_packages_published=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Packages publish failed for ${DEV_VERSION}."
            fi
          fi

      - name: Post or Update PR Comment
        if: steps.npm_publish.outputs.npm_published == 'true' || steps.gh_packages.outputs.gh_packages_published == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const devVersion = '${{ steps.versioning.outputs.dev_version }}';
            const npmPublished = '${{ steps.npm_publish.outputs.npm_published }}' === 'true';
            const ghPublished = '${{ steps.gh_packages.outputs.gh_packages_published }}' === 'true';

            const commentHeader = '### 🚀 PR Dev Preview Released';
            const registries = [];
            if (npmPublished) {
              registries.push('| **npm** | `@rbbtsn0w/adg@' + devVersion + '` | `next` |');
            }
            if (ghPublished) {
              registries.push('| **GitHub Packages** | `@rbbtsn0w/adg@' + devVersion + '` | `next` |');
            }

            const bodyLines = [
              commentHeader,
              '',
              'A temporary development build has been published for testing and acceptance verification:',
              '',
              '| Registry | Package / Version | Dist-tag |',
              '| :--- | :--- | :--- |',
              ...registries,
              '',
              '#### 🛠️ Quick Verification Options',
              '',
              '**1. Run directly with npx (no local install required)**:',
              '```bash',
              `npx @rbbtsn0w/adg@${devVersion} --version`,
              '```',
              '',
              '**2. Self-update via ADG CLI**:',
              '```bash',
              '# Pin to this exact PR build',
              `adg update --tag ${devVersion}`,
              '',
              '# Or follow the latest PR dev channel',
              'adg update --dev',
              '```',
              '',
              '**3. Global install with npm**:',
              '```bash',
              `npm install -g @rbbtsn0w/adg@${devVersion}`,
              '```',
            ];
            const body = bodyLines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.includes(commentHeader));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
