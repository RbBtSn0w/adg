name: PR Target Branch

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  check-base-branch:
    name: Validate base branch
    runs-on: ubuntu-latest
    steps:
      - env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: test "$BASE" = main
